<html><head>

<script>
// RavenTechs PWA Banner v1.1 — en el HEAD para capturar beforeinstallprompt temprano
var __rtPWA = (function() {
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferred = e;
    if (!localStorage.getItem('pwa_installed') && !localStorage.getItem('pwa_rechazado')) {
      setTimeout(function() {
        var b = document.getElementById('bannerPWA');
        if (b) b.style.display = 'flex';
      }, 2000);
    }
  });
  window.addEventListener('appinstalled', function() {
    localStorage.setItem('pwa_installed', '1');
    var b = document.getElementById('bannerPWA');
    if (b) b.style.display = 'none';
  });
  return {
    instalar: function() {
      if (!deferred) return;
      document.getElementById('bannerPWA').style.display = 'none';
      deferred.prompt();
      deferred.userChoice.then(function(c) {
        if (c.outcome === 'accepted') localStorage.setItem('pwa_installed', '1');
        deferred = null;
      });
    },
    rechazar: function() {
      document.getElementById('bannerPWA').style.display = 'none';
      localStorage.setItem('pwa_rechazado', '1');
    }
  };
})();
</script>
<script id="rt-pwa-v2">
/* RavenTechs · Cartel "Instalar la app" v2 — Android/Chrome (botón Instalar) + iPhone/Safari (instrucciones). Se oculta si la app ya está instalada. */
(function(){
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
  if(standalone)return;
  var DIAS=7*864e5, deferred=null, ua=navigator.userAgent||'';
  var esIOS=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1);
  function descartado(){var t=parseInt(ls('rt_pwa_no')||'0',10);return t&&(Date.now()-t)<DIAS;}
  function nombre(){var m=document.querySelector('meta[name="apple-mobile-web-app-title"]');return (m&&m.content)||document.title||'la app';}
  function color(){var m=document.querySelector('meta[name="theme-color"]');var c=m&&m.content;return (c&&/^#[0-9a-f]{6}$/i.test(c)&&parseInt(c.slice(1,3),16)+parseInt(c.slice(3,5),16)+parseInt(c.slice(5,7),16)<600)?c:'#0f1e3d';}
  function offBottom(){var off=0;try{var els=document.body?document.body.querySelectorAll('*'):[];for(var k=0;k<els.length&&k<4000;k++){var e=els[k];if(e.id==='rt-pwa-banner')continue;var cs=getComputedStyle(e);if(cs.position!=='fixed'||cs.display==='none'||cs.visibility==='hidden')continue;var r=e.getBoundingClientRect();if(r.height>30&&r.height<160&&r.width>=innerWidth*0.8&&Math.abs(innerHeight-r.bottom)<2)off=Math.max(off,r.height);}}catch(x){}return off;}
  function quitar(){var b=document.getElementById('rt-pwa-banner');if(b)b.remove();}
  function mostrar(modo){
    if(document.getElementById('rt-pwa-banner')||descartado())return;
    var old=document.getElementById('bannerPWA');if(old)old.style.setProperty('display','none','important');
    var b=document.createElement('div');b.id='rt-pwa-banner';b.setAttribute('role','dialog');
    b.style.cssText='position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2147483000;background:'+color()+';color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.4);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    b.style.bottom='calc('+(offBottom()+12)+'px + env(safe-area-inset-bottom,0px))';
    var t=document.createElement('span');t.style.flex='1';
    if(modo==='ios'){t.innerHTML='📲 Para instalar <b></b>: tocá <b>Compartir</b> <span style="font-size:17px">⬆️</span> y elegí <b>«Agregar a inicio»</b>.';t.getElementsByTagName('b')[0].textContent=nombre();}
    else{t.innerHTML='📲 <b>Instalá '+nombre().replace(/[<>&]/g,'')+'</b> en tu teléfono para abrirla como una app.';}
    b.appendChild(t);
    if(modo!=='ios'){var i=document.createElement('button');i.type='button';i.textContent='Instalar';i.style.cssText='background:#f0b84a;color:#10203d;border:0;border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer';
      i.onclick=function(){if(!deferred)return;quitar();deferred.prompt();deferred.userChoice.then(function(){deferred=null;}).catch(function(){});};b.appendChild(i);}
    var x=document.createElement('button');x.type='button';x.setAttribute('aria-label','Cerrar');x.textContent='✕';x.style.cssText='background:none;border:0;color:#fff;font-size:20px;line-height:1;cursor:pointer;padding:4px 6px';
    x.onclick=function(){ls('rt_pwa_no',String(Date.now()));quitar();};b.appendChild(x);
    (document.body||document.documentElement).appendChild(b);
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;setTimeout(function(){if(deferred)mostrar('android');},2000);});
  window.addEventListener('appinstalled',function(){deferred=null;quitar();ls('rt_pwa_no',String(Date.now()+365*864e5-DIAS));});
  if(esIOS){window.addEventListener('load',function(){setTimeout(function(){mostrar('ios');},3500);});}
  window.__rtPWA2={mostrar:mostrar};
})();
</script>
