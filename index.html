<!DOCTYPE html>
<html><head>
<meta name="theme-color" content="#2C3E50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LegalAR">
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=legalar.html">
<script>
// RavenTechs PWA Banner v1.1 — en el HEAD para capturar beforeinstallprompt temprano
var __rtPWA = (function() {
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferred = e;
    if (!localStorage.getItem('pwa_installed') && !localStorage.getItem('pwa_rechazado')) {
      setTimeout(function() {
        var b = document.getElementById('bannerPWA');
        if (b) b.style.display = 'flex';
      }, 2000);
    }
  });
  window.addEventListener('appinstalled', function() {
    localStorage.setItem('pwa_installed', '1');
    var b = document.getElementById('bannerPWA');
    if (b) b.style.display = 'none';
  });
  return {
    instalar: function() {
      if (!deferred) return;
      document.getElementById('bannerPWA').style.display = 'none';
      deferred.prompt();
      deferred.userChoice.then(function(c) {
        if (c.outcome === 'accepted') localStorage.setItem('pwa_installed', '1');
        deferred = null;
      });
    },
    rechazar: function() {
      document.getElementById('bannerPWA').style.display = 'none';
      localStorage.setItem('pwa_rechazado', '1');
    }
  };
})();
</script>
</head><body><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(e){console.log('SW:',e);});
  });
}
</script>
</body></html>
